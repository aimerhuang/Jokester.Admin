name: jokester-admin

services:
  mysql:
    image: mysql:8.4
    container_name: jokester-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      backend:
        ipv4_address: 172.29.0.30

  redis:
    image: redis:7.4-alpine
    container_name: jokester-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      backend:
        ipv4_address: 172.29.0.40

  api:
    image: ${JOKESTER_IMAGE:-jokester-admin:latest}
    pull_policy: never
    container_name: jokester-api
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: MySql
      Database__ConnectionString: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User ID=${MYSQL_USER};Password=${MYSQL_PASSWORD};Allow User Variables=True;SslMode=None;AllowPublicKeyRetrieval=True;
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      AiMediaStorage__RootPath: /data/private-media/ai
      PROMPT_IMAGE_ROOT: /data/prompt-images
      Security__KnownProxies__0: 172.29.0.10
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${API_PORT:-5049}:8080
    volumes:
      - ./data/private-media:/data/private-media
      - ./data/prompt-images:/data/prompt-images
      - ./data/blog:/app/wwwroot/blog
      - ./data/avatar:/app/wwwroot/avatar
      - ./data/data-protection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/sites/site_code >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
        ipv4_address: 172.29.0.20

  caddy:
    image: caddy:2.10-alpine
    container_name: jokester-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 172.29.0.10

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
